<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Assignment 5: Objects, Arrays, and Functions

// --- Part A: Object ---
let student = {
  name: "Shivam Vishwakarma",
  age: 21,
  isEnrolled: true
};

console.log("Whole Student Object:", student);
console.log("Student Name:", student.name);
console.log("Student Age:", student.age);

// --- Part B: Array ---
let numbers = [10, 20, 30, 40, 50];
let mixed = [100, "JavaScript", true, null];

console.log("First Number:", numbers[0]);
console.log("Last Number:", numbers[numbers.length - 1]);
console.log("Whole Mixed Array:", mixed);

/*
  Comment:
  Why keep arrays with a single data type?
  Keeping arrays uniform ensures predictable data processing, avoids runtime errors 
  during calculations or string operations, makes code easier to read, and allows 
  JavaScript engines to optimize performance.
*/

// --- Part C: Function ---
function greet(name) {
  return "Hello, " + name + "!";
}

let message1 = greet("Alice");
let message2 = greet("Bob");

console.log(message1);
console.log(message2);
    </script>
</body>
</html>
