    <script>
        // Assignment 8: Declaration and Assignment Practice

// Declare without assigning
let message;
console.log("Message before assignment:", message);

// Assign a value
message = "Hello, World!";
console.log("Message after assignment:", message);

// Declare and assign in one line
let name = "Alice";
let age = 25;
let isStudent = true;

// Constant declaration
const MAX_USERS = 100;

// Print all variables
console.log("Name:", name);
console.log("Age:", age);
console.log("Is Student:", isStudent);
console.log("Max Users:", MAX_USERS);
    </script>
