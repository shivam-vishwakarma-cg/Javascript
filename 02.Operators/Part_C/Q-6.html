<!DOCTYPE html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <script>
       // 1. Check if student failed
let studentExamMarks = 30;
let failCutoffMarks = 35;
console.log("Has Student Failed (<):", studentExamMarks < failCutoffMarks);

// 2. Expense budget check
let totalExpenses = 8000;
let monthlyBudget = 10000;
console.log("Are Expenses Under Budget (<):", totalExpenses < monthlyBudget);

// 3. Inventory low stock check
let stockItemsLeft = 7;
let lowStockThreshold = 10;
console.log("Is Stock Low (<):", stockItemsLeft < lowStockThreshold);

// 4. Minimum speed check
let currentVehicleSpeed = 40;
let minimumSpeedLimit = 50;
console.log("Is Vehicle Too Slow (<):", currentVehicleSpeed < minimumSpeedLimit);

// 5. Timer warning check
let remainingMinutes = 4;
let warningThresholdMinutes = 5;
console.log("Is Warning Needed (<):", remainingMinutes < warningThresholdMinutes);
    </script>
