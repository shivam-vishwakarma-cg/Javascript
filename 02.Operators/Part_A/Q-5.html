<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 1. Leftover students in groups of 5
const studentGroupTotal = 53;
const groupSize = 5;
const leftoverStudents = studentGroupTotal % groupSize;
console.log("Leftover Students:", leftoverStudents);

// 2. Unpacked candies
const totalCandies = 128;
const boxCapacity = 10;
const unpackedCandies = totalCandies % boxCapacity;
console.log("Unpacked Candies:", unpackedCandies);

// 3. Check even or odd number
const inputNumber = 27;
const isEvenRemainder = inputNumber % 2; // 0 means even, 1 means odd
console.log("Is Odd (Remainder 1):", isEvenRemainder);

// 4. Leftover toys after full box packing
const totalToys = 237;
const toyBoxCapacity = 6;
const leftoverToys = totalToys % toyBoxCapacity;
console.log("Leftover Toys:", leftoverToys);

// 5. Leftover bus passengers
const waitingPassengers = 185;
const busCapacity = 40;
const leftoverPassengers = waitingPassengers % busCapacity;
console.log("Leftover Passengers:", leftoverPassengers);
    </script>
</body>
</html>
