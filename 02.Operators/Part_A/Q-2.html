<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <script>
// 1. Empty seats on a bus
const totalSeats = 80;
const occupiedSeats = 53;
const emptySeats = totalSeats - occupiedSeats;
console.log("Empty Seats:", emptySeats);

// 2. Final marks after deduction
const initialMarks = 500;
const deductedMarks = 35;
const finalMarks = initialMarks - deductedMarks;
console.log("Final Marks:", finalMarks);

// 3. Remaining boxes in a warehouse
const warehouseBoxes = 2500;
const sentBoxes = 875;
const remainingBoxes = warehouseBoxes - sentBoxes;
console.log("Remaining Boxes:", remainingBoxes);
    </script>
</body>
